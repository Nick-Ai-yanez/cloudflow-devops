name: CloudFlow CI-CD

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  validar:
    name: Validar sitio web
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar archivos principales
        run: |
          test -f index.html
          test -f README.md
          echo "Archivos principales encontrados correctamente"

      - name: Validar contenido HTML
        run: |
          grep -q "<html" index.html
          grep -q "</html>" index.html
          grep -q "<body" index.html
          grep -q "</body>" index.html
          echo "Validacion HTML basica completada"

  desplegar:
    name: Desplegar en AWS EC2
    runs-on: ubuntu-latest
    needs: validar

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar clave SSH
        shell: bash
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/cloudflow.pem
          chmod 600 ~/.ssh/cloudflow.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copiar sitio a EC2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}

        run: |
          scp -i ~/.ssh/cloudflow.pem index.html "$EC2_USER@$EC2_HOST:/tmp/index.html"

      - name: Publicar sitio en Apache
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}

        run: |
          ssh -i ~/.ssh/cloudflow.pem "$EC2_USER@$EC2_HOST" '
            sudo cp /tmp/index.html /var/www/html/index.html &&
            sudo chown apache:apache /var/www/html/index.html &&
            sudo systemctl restart httpd
          '